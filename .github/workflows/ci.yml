name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Called by release.yml so a tag can never publish untested code.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Don't cancel a run on main: it is the one whose result people rely on.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether the code jobs need to run. Replaces paths-ignore, which
  # skipped the jobs entirely -- so a docs-only PR would sit forever against a
  # required status check that never reported. Here the jobs are skipped but
  # ci-ok still reports, so ci-ok is the only check branch protection needs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name == 'workflow_call' || steps.filter.outputs.code }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          code:
            - '!**.md'
            - '!docs/**'
            - '!public/**'
            - '!assets/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        clean: true

    # mise.toml is the single source of truth for tool versions, so the linter
    # here is byte-identical to the one `make lint` runs locally.
    - name: Set up toolchain
      uses: jdx/mise-action@v4
      with:
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted. Please run 'gofmt -s -w .'"
          gofmt -s -l .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    # -diff does not mutate go.mod, unlike the previous tidy-then-git-diff
    # which rewrote it underneath the linter.
    - name: Check go mod tidy
      run: go mod tidy -diff

    - name: Run golangci-lint
      run: golangci-lint run --config=.golangci.yml

    # A workflow that fails to parse surfaces as a run with zero jobs and no
    # usable error message, so catch it here instead.
    - name: Lint workflows
      run: actionlint

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 1.24 is the minimum go.mod declares. GOTOOLCHAIN=local below is what
        # makes that leg meaningful -- with the default (auto), Go silently
        # downloads a newer toolchain and the leg tests nothing. That is
        # exactly what the previous '1.23' leg did.
        go-version: ['1.24', 'stable']
        exclude:
          - os: macos-latest
            go-version: '1.24'
    env:
      GOTOOLCHAIN: ${{ matrix.go-version == 'stable' && 'auto' || 'local' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        clean: true

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: |
        go mod download
        go mod verify

    - name: Run unit tests
      run: go test -v -race -timeout=5m ./pkg/... ./internal/...

    # -race matters here: this package drives scanner/archive/crypto in
    # process, so its concurrency tests are actually instrumented. The CLI and
    # E2E packages spawn a separately built binary, so -race would only cover
    # their harness -- not worth doubling their runtime for.
    - name: Run integration tests
      run: go test -v -race -timeout=3m ./test/integration/...

    - name: Run CLI tests
      run: go test -v -timeout=5m ./test/cli/...

    - name: Run E2E tests
      run: go test -v -timeout=5m ./test/e2e/...

    # One leg only, to avoid four conflicting profiles. Reported to the run
    # summary rather than committed back as a badge, which would need
    # contents: write -- not worth trading write access for an SVG.
    #
    # Only the in-process packages are measured: test/cli and test/e2e spawn a
    # separately built binary, so they contribute nothing to a coverage profile
    # however much they exercise.
    - name: Report coverage
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
      run: |
        go test -race -covermode=atomic \
          -coverpkg=./pkg/...,./internal/... \
          -coverprofile=coverage.out \
          ./pkg/... ./internal/... ./test/integration/...
        {
          echo "## Coverage"
          echo ""
          echo '```'
          go tool cover -func=coverage.out | tail -20
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      # Scoped to this job rather than granted to the whole workflow.
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        clean: true

    # Replaces `go install ...@latest` on every run: unpinned, non-reproducible,
    # and a couple of minutes of compilation each time.
    - name: Set up toolchain
      uses: jdx/mise-action@v4
      with:
        cache: true

    - name: Run govulncheck
      run: govulncheck ./...

    # gosec also runs inside golangci-lint, where .golangci.yml holds the
    # exclusion list (the two used to disagree: six exclusions here, two
    # there). This run exists only to produce SARIF for the Security tab, so
    # -no-fail avoids reporting the same finding as a second failure.
    # Exclusion list mirrors linters.settings.gosec.excludes in .golangci.yml,
    # which is the source of truth; there is no way to share one list between
    # a YAML block and a command-line flag.
    - name: Run gosec (SARIF for the Security tab)
      run: gosec -no-fail -exclude=G115,G117,G204,G304,G407,G703 -fmt sarif -out results.sarif ./...

    # Not continue-on-error: a broken upload used to be invisible and would
    # silently stale the Security tab. Fork PRs get a read-only token and
    # genuinely cannot upload, so they are skipped explicitly instead.
    - name: Upload SARIF file
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif

  test-install-script:
    name: Test Install Script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # No longer needs [lint, test, security]: this job lints a shell script and
    # runs a self-contained fixture install. Serialising it behind the whole
    # test matrix added several minutes for nothing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # The install script test suite builds a real binary to serve from its
    # local fixture release.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: true
        cache-dependency-path: go.sum

    - name: Test install script help
      run: |
        chmod +x install.sh
        ./install.sh --help

    # Covers checksum verification end to end, including the case that
    # matters: a corrupted archive must not be installed.
    - name: Run install script test suite
      run: bash test/install/test_install.sh

    - name: Test install script dry run
      run: |
        DEBUG=1 NO_SUDO=1 SKIP_SHELL_INTEGRATION=1 ./install.sh --version v99.99.99 || echo "Expected failure for non-existent version"

  # The single required status check. Reports on every run, including
  # docs-only ones where the jobs above are skipped.
  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs: [changes, lint, test, security, test-install-script]
    if: always()
    steps:
    - name: Check job results
      run: |
        results='${{ join(needs.*.result, ' ') }}'
        echo "Job results: $results"
        for r in $results; do
          if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
            echo "A required job did not succeed."
            exit 1
          fi
        done
        echo "All required jobs succeeded or were skipped."
