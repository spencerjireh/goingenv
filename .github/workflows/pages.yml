name: Deploy to GitHub Pages

on:
  push:
    # main only. This job deploys straight to the production Pages site with
    # no environment gate, so listing develop here meant any push to it
    # published immediately.
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ci.yml gates the merge, but this workflow triggers directly on push to
      # main and is not gated on ci-ok, so a push that bypasses a PR would
      # otherwise deploy unchecked. Same assertions, ~10 seconds.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: go.sum

      - name: Check the website before deploying
        run: make test-site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
