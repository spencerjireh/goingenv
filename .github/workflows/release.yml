name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Gate the release on the full CI suite. A tag push previously went straight
  # to building and publishing, so a tag cut from a branch with failing tests
  # would ship. A called workflow's permissions must be a subset of the
  # caller's, hence security-events here.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write
      # Both required by attest-build-provenance: OIDC to prove the workflow
      # identity, attestations to record the result.
      id-token: write
      attestations: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # GoReleaser needs full history and tags to build the changelog.
        fetch-depth: 0

    # goreleaser is pinned in mise.toml alongside the rest of the toolchain,
    # so `make release-local` and this job run the same version.
    - name: Set up toolchain
      uses: jdx/mise-action@v4
      with:
        cache: true

    # Stamp the version into the copy of install.sh published as a release
    # asset, so `curl .../<tag>/install.sh | bash` installs that exact version.
    # Written outside dist/, which `goreleaser --clean` wipes.
    - name: Create versioned install script
      run: |
        mkdir -p build
        cp install.sh build/install.sh
        sed -i 's/^SCRIPT_VERSION=""$/SCRIPT_VERSION="'"$GITHUB_REF_NAME"'"/' build/install.sh

        # A silent sed miss would publish an installer that defaults to
        # "latest" instead of this tag, so verify rather than assume.
        if ! grep -q "SCRIPT_VERSION=\"$GITHUB_REF_NAME\"" build/install.sh; then
          echo "ERROR: failed to embed version in install.sh"
          grep "SCRIPT_VERSION=" build/install.sh
          exit 1
        fi
        chmod +x build/install.sh
        echo "Embedded version $GITHUB_REF_NAME in install.sh"

    # The sboms block in .goreleaser.yaml shells out to syft.
    - name: Install syft for SBOM generation
      uses: anchore/sbom-action/download-syft@v0

    - name: Run GoReleaser
      run: goreleaser release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Lets anyone verify the archives were built by this workflow from this
    # repo: gh attestation verify <archive> --repo spencerjireh/goingenv
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: dist/*.tar.gz

    # Guards the contract install.sh depends on. Cheap, and failing here is far
    # better than publishing an artifact nobody can install.
    - name: Verify release artifact contract
      run: |
        set -euo pipefail
        fail=0

        for f in dist/*.tar.gz; do
          contents=$(tar -tzf "$f")
          if [ "$contents" != "goingenv" ]; then
            echo "FAIL: $f should contain exactly 'goingenv', got: $contents"
            fail=1
          fi

          name=$(basename "$f")
          case "$name" in
            goingenv-${GITHUB_REF_NAME}-*.tar.gz) ;;
            *) echo "FAIL: $name does not match goingenv-<tag>-<os>-<arch>.tar.gz"; fail=1 ;;
          esac

          # The exact lookup install.sh performs.
          if ! awk -v n="$name" '$2 == n { found=1 } END { exit !found }' dist/checksums.txt; then
            echo "FAIL: no checksums.txt entry for $name"
            fail=1
          fi
        done

        exit $fail
