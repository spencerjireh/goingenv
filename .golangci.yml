version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - gocritic
    - gosec
    - misspell
    - unconvert
    - unparam
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocyclo:
      min-complexity: 15
    gocritic:
      enabled-tags:
        - performance
        - style
        - experimental
      disabled-checks:
        - whyNoLint
    gosec:
      # Source of truth for gosec exclusions. The SARIF run in ci.yml passes
      # the same list on the command line -- keep the two in sync.
      # Rules excluded as false positives for a file-management CLI:
      excludes:
        - G115  # integer overflow in file size conversions
        - G117  # struct fields named "Password" flagged as hardcoded secrets
        - G204  # subprocess launched with a variable (expected in a CLI)
        - G304  # file inclusion via variable (the entire point of this tool)
        - G407  # false positive on make([]byte, N) filled by rand.Read
        - G703  # path traversal via taint analysis (expected in a file CLI)
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*os.File).Close
        - (*bufio.Writer).Flush
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
      - path: "pkg/types/mocks.go"
        linters:
          - gocritic
          - gosec
          - errcheck

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      colors: true
